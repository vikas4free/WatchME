[package]
name = "watchme"
version = "0.1.0"
description = "WatchME cinematic streaming library"
authors = ["WatchME"]
edition = "2021"

[lib]
name = "watchme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
